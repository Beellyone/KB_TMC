services:
  app:
    build: ./backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://tmc:tmc_secret@db:5432/tmc_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://app:8001
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: tmc_db
      POSTGRES_USER: tmc
      POSTGRES_PASSWORD: tmc_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmc -d tmc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
